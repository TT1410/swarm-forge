# Format: card <type> <role> [<role>...]
# Card routes are ordered: the first role starts a card and the last completes it.
# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume queued handoffs that share priority, card type, and reverse/forward
# with the first file as one batch.
# The optional propagation token defaults to forward-only. Use back-one or
# back-all to queue merge-only copies to earlier roles on the active card route.
# Any fields after those tokens are passed to the agent CLI, e.g. --yolo.
# Grok yolo is --permission-mode bypassPermissions, added by the launcher.
card utility coder cleaner
card component specifier coder cleaner architect hardender
card QA specifier coder cleaner architect hardender QA
card review cleaner architect hardender QA
window-invisible specifier grok master
window-invisible coder grok coder
window-invisible cleaner grok cleaner batch back-one
window-invisible architect grok architect batch back-all
window-invisible hardender grok hardender batch
window-invisible QA grok QA batch back-all

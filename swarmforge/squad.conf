max_transient_agents 10
# Transient worker backend defaults.
# Global default (one token):
#   transient_agent squad-leader
# Per-template overrides (two tokens), e.g.:
#   transient_agent implementer codex
#   transient_agent code-reviewer claude
#   transient_agent hardener grok
# Allowed backends: codex, claude, copilot, grok, squad-leader.
# This selects the tool used when a worker is spawned; it does not start agents.
#
# Writers inherit squad-leader (Codex). Judges use Grok.
#   Codex: analyst, gherkin-writer, qa-procedure-writer, implementer,
#          cleaner, hardener, qa, senior-implementer
#   Grok:  code-reviewer, architect
# Persistent (swarmforge.conf): squad-leader Codex, troubleshooter Grok.
transient_agent squad-leader
transient_agent code-reviewer grok
transient_agent architect grok
# Per-template concurrent caps. Only this file sets them (no hardcoded list).
# 1 = singleton. SL and Troubleshooter are persistent and do not count.
max_active_template hardener 1
max_active_template qa 1
max_active_template architect 1
max_active_template senior-implementer 1
max_active_template system-analyst 1
max_active_template analyst 3
max_active_template gherkin-writer 3
max_active_template qa-procedure-writer 3
max_active_template implementer 3
max_active_template cleaner 3
max_active_template code-reviewer 3
approval_required implementation-plan true
approval_required frame true
approval_required theme false
approval_required story false
approval_required gherkin true
approval_required qa_procedure true
approval_required implementation false
approval_required code_review false
approval_required hardening false
approval_required qa false
approval_required architecture false
approval_required final false
approval_required implementation_order false
approval_required dependency_checker false
# On retire, copy pane/liveness into .squad/sessions/<agent-id>/ then still kill tmux.
# Default is on. Set false for delete-as-you-go (no files).
save_agent_sessions true

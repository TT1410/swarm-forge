# Format:
#   window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
#   window-invisible <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# Persistent roles start at ./swarm. `window` also opens a Terminal surface;
# `window-invisible` creates the tmux session only (no Terminal window).
# Transient invisible workers are spawned dynamically; their default backends
# are in swarmforge/squad.conf, not this file.
window squad-leader codex master task
window-invisible troubleshooter codex master task

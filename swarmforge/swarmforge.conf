# Format: window-invisible <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
# Grok yolo is --permission-mode bypassPermissions, added by the launcher.
window-invisible specifier grok master
window-invisible coder codex coder --yolo
window-invisible cleaner codex cleaner batch --yolo
window-invisible architect grok architect batch
window-invisible hardender codex hardender batch --yolo
window-invisible QA grok QA batch
